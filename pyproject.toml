[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag4re"
version = "0.1.0"
description = "Retrieval-Augmented Generation-based Relation Extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Sefika Efeoglu" }
]
dependencies = [
  "sentence-transformers==2.2.2",
  "transformers==4.38.2",
  "accelerate==0.27.2",
  "sentencepiece==0.1.98",
  "configparser==5.3.0",
  "numpy==1.23.5",
  "scikit-learn==1.4.0",
  "pandas==1.3.5"
]

[project.scripts]
rag4re = "rag4re.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "utils"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "rag4re*",
  "retrieval*",
  "generation_module*",
  "evaluation*",
  "data_augmentation*"
]
